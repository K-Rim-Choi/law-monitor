name: Update bills and deploy Pages

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "data/impact-overrides.json"
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    env:
      OPEN_ASSEMBLY_API_KEY: ${{ secrets.OPEN_ASSEMBLY_API_KEY }}
      BILL_KEYWORDS: ${{ vars.BILL_KEYWORDS || '개정,일부개정,전부개정' }}
      BILL_ERACO: ${{ vars.BILL_ERACO || '22' }}
      MAX_PAGES: ${{ vars.MAX_PAGES || '5' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test API connectivity
        run: |
          echo "Testing connection to open.assembly.go.kr..."
          curl -s --max-time 10 -o /dev/null -w "HTTP %{http_code} | time %{time_total}s\n" \
            "https://open.assembly.go.kr/portal/openapi/ALLBILLV2?KEY=$OPEN_ASSEMBLY_API_KEY&Type=json&pIndex=1&pSize=1" \
            || echo "Connection failed (curl exit: $?)"

      - name: Fetch National Assembly bills
        run: |
          node scripts/fetch-open-assembly.mjs
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          const { bills, query } = JSON.parse(readFileSync("data/bills.json", "utf8"));
          const fetched = new Set(bills.map(({ billNo }) => billNo));
          const missing = query.billNos.filter((billNo) => !fetched.has(billNo));
          if (!bills.length || missing.length) {
            throw new Error(`Missing bill data: ${missing.join(", ") || "no bills returned"}`);
          }
          JS

      - name: Persist successfully fetched bills.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/bills.json; then
            echo "변경 사항 없음 — 커밋 생략"
          else
            git add data/bills.json
            git commit -m "데이터 자동 갱신: 의안 목록 동기화 [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}" && \
              git rebase "origin/${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
              echo "푸시 실패, 재시도 ($attempt)..."
              sleep 3
            done
            exit 1
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
